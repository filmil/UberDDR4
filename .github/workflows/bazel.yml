# Runs everything that needs no Vivado: lint, the compile checks, the
# ASCII check and both formal suites, which is `run_compile.sh --all`
# without its simulation stage. The Vivado targets are tagged `manual`, so
# `bazel test //...` leaves them out; see docs/BAZEL.md.
name: Bazel

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: bazel-contrib/setup-bazel@0.19.1
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: true
      - name: Test
        run: bazel test //...
